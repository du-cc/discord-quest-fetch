name: Update  Quests

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: update-quests
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Fetch latest 100 quests from upstream
        run: node update.mjs

      - name: Commit and push if the file changed
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: sync latest quests from upstream source"
          file_pattern: data/quests.json
          commit_user_name: "github-actions[bot]"
          commit_user_email: "github-actions[bot]@users.noreply.github.com"
